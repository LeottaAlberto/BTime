<div class="relative z-10 flex flex-col gap-4">

  <h1 class="font-bold text-4xl">{{bannerTitle()}}</h1>

  <!-- Filters -->
  <div class="flex flex-row justify-start items-center gap-2 text-neutral-500">
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs">
      <p>4k HDR</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs">
      <p>18+</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs">
      <p>Sci-Fi</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs">
      <p>Season 2</p>
    </div>
  </div>

  <!-- Description -->
  <div class="text-sm w-1/3 text-neutral-500">
    <p>{{description()}}<p>
  </div>

  <!-- Actions -->
  <div class="flex flex-row justify-items-center gap-3">

    <div class="flex flex-row justify-start items-center gap-2 py-2 px-4 rounded-md bg-purple-800 drop-shadow-lg drop-shadow-purple-500/50 cursor-pointer">
      <div class="pi pi-play-circle text-center"></div>
      <h1>Play</h1>
    </div>
    <div class="flex flex-row justify-start items-center gap-2 py-2 px-4 rounded-md bg-neutral-800 outline-1 outline-neutral-700 cursor-pointer">
      <div class="pi pi-info-circle text-center"></div>
      <h1>More Info</h1>
    </div>
  </div>

</div>
