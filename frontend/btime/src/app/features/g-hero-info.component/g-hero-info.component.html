<div class="relative z-10 flex flex-col gap-4">

  <h1 class="font-bold text-4xl">{{bannerTitle()}}</h1>

  <!-- Filters -->
  <div class="flex flex-row justify-start items-center gap-2 text-neutral-500">
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs">
      <p>4k HDR</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs">
      <p>18+</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs">
      <p>Sci-Fi</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs">
      <p>Season 2</p>
    </div>
  </div>

  <!-- Description -->
  <div class="text-sm w-1/3 text-neutral-500">
    <p>{{description()}}<p>
  </div>

  <!-- Actions -->
  <div class="flex flex-row justify-items-center gap-3 pt-2">

    <div
      tabindex="0"
      role="button"
      aria-label="Riproduci"
      class="flex flex-row justify-start items-center gap-2 py-2.5 px-5 rounded-xl bg-purple-700 drop-shadow-lg drop-shadow-purple-500/50 cursor-pointer transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-purple-400 focus:bg-purple-600 focus:scale-105 active:scale-95 text-white font-medium">
      <div class="pi pi-play-circle text-lg"></div>
      <span class="text-sm font-semibold">Play</span>
    </div>
    <div
      tabindex="0"
      role="button"
      aria-label="Maggiori informazioni"
      class="flex flex-row justify-start items-center gap-2 py-2.5 px-5 rounded-xl bg-neutral-800/90 border border-neutral-700 cursor-pointer transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-purple-400 focus:bg-neutral-700 focus:scale-105 active:scale-95 text-white font-medium">
      <div class="pi pi-info-circle text-lg"></div>
      <span class="text-sm font-semibold">More Info</span>
    </div>
  </div>

</div>
