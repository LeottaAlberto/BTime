<div class="bg-neutral-900/80 border border-neutral-800 rounded-2xl p-8 flex flex-col gap-6 shadow-xl min-h-full">
  <!-- Header Dashboard -->
  <div class="flex flex-col gap-1 border-b border-neutral-800 pb-5">
    <h1 class="text-2xl font-bold text-white tracking-tight">Your Modules</h1>
    <p class="text-xs text-neutral-400 font-medium">Seleziona uno dei servizi disponibili sul tuo NAS personale</p>
  </div>

  <!-- Griglia delle Card -->
  @if (dashService.dashMenu(); as items) {
    @if (items.length > 0) {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (d of items; track d.id ?? $index) {
          <g-dash-card
            [title]="d.title || d.name || ''"
            [img]="d.img || ''"
            [description]="d.description || ''"
            [route]="d.route"/>
        }
      </div>
    } @else {
      <div class="flex flex-col items-center justify-center p-12 text-neutral-500 gap-2">
        <i class="pi pi-inbox text-3xl"></i>
        <p class="text-sm">Nessun modulo disponibile al momento.</p>
      </div>
    }
  }
</div>
