<div
  tabindex="0"
  role="button"
  [attr.aria-label]="title()"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()"
  class="group relative flex flex-col justify-end w-full h-56 md:h-64 rounded-2xl overflow-hidden cursor-pointer
         border border-neutral-800 hover:border-sky-500/50 shadow-lg hover:shadow-2xl hover:shadow-sky-500/10
         transition-all duration-300 ease-out transform hover:-translate-y-1
         focus:outline-none focus:ring-4 focus:ring-sky-400 focus:border-sky-400 focus:scale-[1.03] focus:shadow-2xl focus:shadow-sky-500/30">

  <!-- Immagine di sfondo con zoom fluido all'hover e focus -->
  <div
    class="absolute inset-0 bg-cover bg-center transition-transform duration-500 ease-out group-hover:scale-105 group-focus:scale-105"
    [style.backgroundImage]="img() ? 'url(' + img() + ')' : ''">
  </div>

  <!-- Gradiente scuro di sovrapposizione per contrasto testo ottimale -->
  <div class="absolute inset-0 bg-linear-to-t from-neutral-950 via-neutral-950/65 to-transparent"></div>

  <!-- Contenuto della Card -->
  <div class="relative z-10 p-5 flex flex-col gap-1.5">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold text-white tracking-wide group-hover:text-sky-400 group-focus:text-sky-400 transition-colors">
        {{ title() }}
      </h2>
      <span class="w-8 h-8 rounded-full bg-white/10 group-hover:bg-sky-500 group-focus:bg-sky-500 text-white flex items-center justify-center transition-all duration-300 transform group-hover:translate-x-1 group-focus:translate-x-1 shrink-0">
        <i class="pi pi-arrow-right text-xs"></i>
      </span>
    </div>

    @if (description()) {
      <p class="text-xs text-neutral-300 line-clamp-2 leading-relaxed">
        {{ description() }}
      </p>
    }
  </div>
</div>
