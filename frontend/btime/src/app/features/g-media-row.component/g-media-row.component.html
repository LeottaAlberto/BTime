<div class="flex flex-col gap-4 w-full text-white mt-8">
  <h2 class="text-xl font-bold px-2">{{titleRow()}}</h2>

  <div class="px-4">
    <!-- Horizontal Cards (Continue Watching) -->
    @if (!isVertical()) {
      <div class="flex flex-row justify-start items-center gap-5 overflow-x-auto scroll-smooth pt-2 pb-4 px-2 scrollbar-thumb-neutral-700">
        @for (item of items(); track item.id) {
          <g-resume-card
            [cardTitle]="item.title"
            [epName]="item.epName ?? ''"
            [season]="item.season"
            [episode]="item.episode"
            [minuteLeft]="item.minuteLeft ?? 0"
            [totMinute]="item.totMinute ?? 0"
            [progress]="item.progress ?? 0"
            [icon]="item.icon" />
        } @empty {
          <p class="text-neutral-500 text-sm italic py-2">Nessun contenuto in sospeso.</p>
        }
      </div>
    } @else {
      <!-- Vertical Poster Row (Films, TV Series, etc.) -->
      <div class="flex flex-row justify-start items-center gap-5 overflow-x-auto scroll-smooth pt-2 pb-4 px-2 scrollbar-thumb-neutral-700">
        @for (item of items(); track item.id) {
          <g-poster-card
            [id]="item.id"
            [title]="item.title"
            [icon]="item.icon"
            [season]="item.seasonsCount ?? item.season"
            [year]="item.releaseYear"
            [duration]="item.duration"
            [rating]="item.rating" />
        } @empty {
          <p class="text-neutral-500 text-sm italic py-2">Nessun elemento disponibile.</p>
        }
      </div>
    }
  </div>
</div>
