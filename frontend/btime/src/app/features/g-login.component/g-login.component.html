<form (submit)="$event.preventDefault(); onClick()" class="w-120 bg-neutral-500 p-10 m-10 rounded-xl text-zinc-50">
  <!-- Header -->
  <div class="flex flex-row items-center justify-center gap-2">
    <div
    class="w-20 h-20 rounded-full overflow-hidden
           bg-[url('https://cdn.create.vista.com/api/media/small/333790434/stock-photo-cropped-view-woman-holding-alarm-clock-blue-background-panoramic-shot')]
           bg-no-repeat bg-center bg-auto bg-amber-400">
          </div>
    <h1 class="text-6xl font-bold">BTime</h1>
  </div>

  <!-- Body -->
  <div class="text-center flex flex-col gap-4 mt-4">
    <h3>Login into Dashboard</h3>

    @if (errorMessage()) {
      <div class="flex items-center gap-2 p-3 rounded-lg bg-red-950/80 border border-red-500/50 text-red-200 text-xs text-left shadow-lg">
        <span class="pi pi-exclamation-triangle text-red-400 text-base shrink-0"></span>
        <span class="flex-1 font-medium">{{ errorMessage() }}</span>
      </div>
    }
    <!-- Inputs -->
    <div class="flex flex-col gap-2 justify-start">
      <div class="text-left flex flex-col gap-1">
        <label for="username">Username</label>
        <div class="relative flex items-center">
          <span class="pi pi-user absolute left-3 text-neutral-300 pointer-events-none text-xl"></span>
          <input
            #usernameInput
            type="text"
            name="username"
            tabindex="0"
            class="w-full h-10 rounded-md bg-neutral-600 outline-none border border-neutral-700 focus:border-purple-400 focus:ring-4 focus:ring-purple-400 pl-10 pr-4 text-zinc-50 transition-all"
            [value]="username() ?? ''"
            (input)="username.set(usernameInput.value)"
            required>
        </div>
      </div>

      <div class="text-left flex flex-col gap-1">
        <label for="mail">Mail</label>
        <div class="relative flex items-center">
          <span class="pi pi-user absolute left-3 text-neutral-300 pointer-events-none text-xl"></span>
          <input
            #mailInput
            type="email"
            name="mail"
            tabindex="0"
            class="w-full h-10 rounded-md bg-neutral-600 outline-none border border-neutral-700 focus:border-purple-400 focus:ring-4 focus:ring-purple-400 pl-10 pr-4 text-zinc-50 transition-all"
            [value]="email() ?? ''"
            (input)="email.set(mailInput.value)"
            required>
        </div>
      </div>


      <div class="text-left flex flex-col gap-1">
        <label for="password">Password</label>
        <div class="relative flex items-center">
          <span class="pi pi-lock absolute left-3 text-neutral-300 pointer-events-none text-xl"></span>
          <input
            #passwordInput
            type="password"
            name="password"
            tabindex="0"
            class="w-full h-10 rounded-md bg-neutral-600 outline-none border border-neutral-700 focus:border-purple-400 focus:ring-4 focus:ring-purple-400 pl-10 pr-4 text-zinc-50 transition-all"
            [value]="password() ?? ''"
            (input)="password.set(passwordInput.value)"
            required>
          <span class="pi pi-eye absolute right-3 text-neutral-300 pointer-events-none text-xl cursor-pointer z-50"></span>
        </div>
      </div>
    </div>

    <!-- Remember e forgotten password -->
    <div class="flex flex-row justify-between items-center text-sm">
      <label class="flex flex-row items-center gap-2 cursor-pointer select-none">
        <input type="checkbox" name="rememberme" id="rememberme" tabindex="0" class="peer sr-only focus:outline-none">
        <div class="size-5 rounded bg-neutral-700 border border-neutral-500 peer-focus:ring-2 peer-focus:ring-purple-400 flex items-center justify-center transition-colors hover:border-neutral-400">
          <span class="pi pi-check text-lime-500 text-xs font-bold hidden peer-checked:block"></span>
        </div>
        <span>Remember Me</span>
      </label>
      <a href="" tabindex="0" class="hover:underline text-neutral-300 focus:outline-none focus:ring-2 focus:ring-purple-400 rounded px-1">Forgot Password?</a>
    </div>

  </div>

  <!-- Footer -->
  <div class="flex flex-col items-center pt-4 gap-2">
    <input
      type="submit"
      tabindex="0"
      class="w-8/12 h-10 bg-neutral-800 rounded-md cursor-pointer hover:bg-neutral-900 transition-all focus:outline-none focus:ring-4 focus:ring-purple-400 focus:scale-105"
      value="Login">
    <div class="flex flex-row justify-center gap-1 text-xs">
      <p>No account?</p>
      <a href="" tabindex="0" class="hover:underline text-neutral-300 focus:outline-none focus:ring-2 focus:ring-purple-400 rounded px-1">Register Now</a>
    </div>
  </div>
</form>
