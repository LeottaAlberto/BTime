<div
  class="fixed bottom-4 right-4 z-50 transition-all duration-300"
  [class.hidden]="!alert.isVisible()">

  <div class="alert-card min-w-80 p-3 flex flex-col gap-3 bg-neutral-950 rounded-md border-l-4 shadow-2xl"
  [style.border-left]="alert.statusColor()">
    <div class="flex flex-row items-center gap-3">
      <div class="rounded-full p-2.5 pi pi-check text-xs"
      [style.backgroundColor]="alert.statusColor()"></div>

      <div class="flex flex-col flex-1">
        <h1 class="text-sm font-semibold text-white">{{ alert.title() }}</h1>
        <p class="text-xs text-neutral-400">{{ alert.message() }}</p>
      </div>

      <!-- Pulsante chiusura manuale -->
      <button class="pi pi-times text-xs text-neutral-400 hover:text-white cursor-pointer" (click)="alert.close()"></button>
    </div>

    <!-- Barra verde animata -->
    <div class="w-full h-1 bg-neutral-800 rounded-full overflow-hidden">
      <div
        class="h-full rounded-full progress-bar"
        [style.backgroundColor]="alert.statusColor()"
        [style.--duration.ms]="alert.duration()">
      </div>
    </div>
  </div>

</div>
