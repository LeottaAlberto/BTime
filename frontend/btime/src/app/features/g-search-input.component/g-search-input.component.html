<div
  tabindex="0"
  role="button"
  aria-label="Cerca film o serie TV"
  (click)="searchInput.focus()"
  (keydown.enter)="searchInput.focus(); $event.stopPropagation()"
  class="flex flex-row gap-3 sm:gap-4 items-center w-full bg-neutral-800/90 border border-neutral-700/60 p-2.5 sm:p-3.5 px-4 sm:px-5 rounded-full cursor-pointer transition-all focus:outline-none focus:ring-4 focus:ring-purple-400 focus:border-purple-400 focus-within:ring-4 focus-within:ring-purple-400 focus-within:border-purple-400">

  <div class="pi pi-search text-base sm:text-xl text-neutral-400 shrink-0"></div>

  <input
    #searchInput
    type="text"
    tabindex="-1"
    placeholder="Search movies, series..."
    (keydown.escape)="searchInput.blur()"
    class="w-full bg-transparent outline-none border-none text-white placeholder-neutral-400 text-xs sm:text-sm 2xl:text-base focus:outline-none">
</div>
