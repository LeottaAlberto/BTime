<div
  class="relative flex justify-center items-center w-full min-h-screen bg-neutral-950 bg-cover bg-center bg-no-repeat overflow-x-hidden p-4 sm:p-6 select-none"
  style="background-image: url('/auth-wallpaper.jpg');"
>
  <!-- Sfumatura scura per garantire il massimo contrasto con il form -->
  <div class="absolute inset-0 bg-neutral-950/80 backdrop-blur-xs pointer-events-none"></div>

  <!-- Sferiche luci ambientali per intensificare l'effetto vetro (Glassmorphism) -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-violet-800/15 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-1/3 left-1/3 w-80 h-80 bg-amber-500/10 rounded-full blur-[140px] pointer-events-none"></div>

  <!-- Card Contenitore Principale (Glassmorphism) -->
  <div
    class="relative z-10 w-full max-w-md bg-neutral-900/60 backdrop-blur-2xl border border-white/10 p-6 sm:p-8 rounded-2xl text-zinc-50 shadow-2xl shadow-purple-950/60 flex flex-col gap-5"
  >
    <!-- Header con g-title -->
    <div class="flex flex-col items-center gap-2 text-center">
      <g-title />
      <span class="px-2.5 py-0.5 rounded-full bg-purple-500/15 border border-purple-400/30 text-[10px] font-semibold text-purple-300 uppercase tracking-wider">
        Crea Account
      </span>
    </div>

    <!-- Alert Errore -->
    @if (errorMessage()) {
      <div class="flex items-center gap-2.5 p-3 rounded-xl bg-red-950/70 border border-red-500/40 text-red-200 text-xs text-left shadow-lg">
        <span class="pi pi-exclamation-triangle text-red-400 text-base shrink-0"></span>
        <span class="flex-1 font-medium leading-relaxed">{{ errorMessage() }}</span>
      </div>
    }

    <!-- Alert Successo -->
    @if (successMessage()) {
      <div class="flex items-center gap-2.5 p-3 rounded-xl bg-emerald-950/70 border border-emerald-500/40 text-emerald-200 text-xs text-left shadow-lg">
        <span class="pi pi-check-circle text-emerald-400 text-base shrink-0"></span>
        <span class="flex-1 font-medium leading-relaxed">{{ successMessage() }}</span>
      </div>
    }

    <!-- Form Registrazione -->
    <form (submit)="$event.preventDefault(); onSubmit($event)" class="flex flex-col gap-3.5">
      <g-form-input
        [(inputValue)]="username"
        [cName]="'username'"
        [icon]="'user'"
        [isRequired]="true"
        [label]="'Username'"
      />

      <g-form-input
        [(inputValue)]="email"
        [cName]="'email'"
        [icon]="'envelope'"
        [isRequired]="true"
        [label]="'Email'"
      />

      <g-form-input
        [(inputValue)]="password"
        [cName]="'password'"
        [icon]="'lock'"
        [isRequired]="true"
        [label]="'Password'"
        [isPassword]="true"
      />

      <g-form-input
        [(inputValue)]="confirmPassword"
        [cName]="'confirmPassword'"
        [icon]="'lock'"
        [isRequired]="true"
        [label]="'Conferma Password'"
        [isPassword]="true"
      />

      <g-form-input
        [(inputValue)]="secretPassword"
        [cName]="'secretPassword'"
        [icon]="'key'"
        [isRequired]="true"
        [label]="'Secret Password'"
        [isPassword]="true"
        [isSpecial]="true"
      />

      <!-- Action Button con g-button -->
      <div class="flex flex-col items-center gap-3 pt-2">
        <g-button
          type="submit"
          variant="primary"
          label="Crea Account"
          icon="user-plus"
          [loading]="isLoading()"
          [disabled]="isLoading()"
        />

        <!-- Footer link a Login -->
        <div class="flex flex-row justify-center items-center gap-1.5 text-xs text-neutral-400 pt-1">
          <p>Hai già un account?</p>
          <button
            type="button"
            tabindex="0"
            (click)="onClickLogin()"
            class="font-semibold text-purple-400 hover:text-purple-300 hover:underline cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-400 rounded px-1 transition-colors"
          >
            Accedi
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
