<aside class="flex flex-col justify-between w-64 min-w-64 h-full border-r border-neutral-800 p-4 select-none shrink-0">
  <!-- Head: Brand & Logo -->
  <div
    tabindex="0"
    role="button"
    aria-label="Home Dashboard"
    class="flex items-center gap-3 pb-4 border-b border-neutral-800/80 cursor-pointer rounded-xl p-1 transition-all focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-neutral-800/50"
    (click)="router.navigate(['/dashboard'])"
    (keydown.enter)="router.navigate(['/dashboard'])"
    (keydown.space)="router.navigate(['/dashboard'])">
    <div
      class="w-10 h-10 rounded-xl overflow-hidden shadow-md ring-1 ring-neutral-700/60
             bg-[url('https://cdn.create.vista.com/api/media/small/333790434/stock-photo-cropped-view-woman-holding-alarm-clock-blue-background-panoramic-shot')]
             bg-no-repeat bg-center bg-cover shrink-0">
    </div>
    <div class="flex flex-col min-w-0">
      <div class="flex items-center gap-2">
        <h1 class="text-lg font-bold tracking-tight text-white leading-tight">BTime</h1>
        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/25">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          NAS
        </span>
      </div>
      <p class="text-[11px] text-neutral-400 font-medium">Personal Cloud</p>
    </div>
  </div>

  <!-- Body: Navigation Items -->
  <div class="flex-1 flex flex-col gap-1 overflow-y-auto py-3">
    <div class="px-2 pb-1">
      <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Navigazione</span>
    </div>

    @for (item of navItems(); track item.label) {
      <g-nav-item
        [icon]="item.icon"
        [label]="item.label"
        [isSelected]="selectedLabel() == item.label"
        (select)="onSelectNavItem(item.label)"/>
    }
  </div>

  <!-- Footer: Scheda Utente & Logout -->
  <div class="pt-3 border-t border-neutral-700/80">
    <div class="flex items-center justify-between p-2.5 rounded-xl bg-neutral-800/50 hover:bg-neutral-800/90 border border-neutral-750 transition-colors">
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- Avatar con indicatore online -->
        <div class="relative shrink-0">
          <div
            tabindex="0"
            role="button"
            aria-label="Dettagli profilo"
            class="w-9 h-9 rounded-full overflow-hidden ring-1 ring-neutral-600
                   bg-[url('https://imgs.search.brave.com/Nt1z2ObBrGxK-9i_PJ6ioz7PbFpYm1yCo7tbltrIVV0/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzL2M4LzA5/L2MzL2M4MDljM2Fh/MjI1N2I2ZTEwM2Zl/OGIzNzcwMWMwZDAw/LmpwZw')]
                   bg-no-repeat bg-center bg-cover cursor-pointer hover:opacity-90 transition-all focus:outline-none focus:ring-2 focus:ring-purple-400 focus:scale-105"
            title="Dettagli profilo"
            (click)="onClick()"
            (keydown.enter)="onClick()"
            (keydown.space)="onClick()">
          </div>
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-neutral-900 pointer-events-none"></span>
        </div>

        <!-- Dati Utente (Username + Email) -->
        <div class="flex flex-col min-w-0">
          <span class="text-xs font-semibold text-white truncate" [title]="auth.currentUser()?.username || 'Utente'">
            {{ auth.currentUser()?.username || 'Utente' }}
          </span>
          <span class="text-[10px] text-neutral-400 truncate" [title]="auth.currentUser()?.email || ''">
            {{ auth.currentUser()?.email }}
          </span>
        </div>
      </div>

      <!-- Pulsante Logout -->
      <button
        type="button"
        tabindex="0"
        aria-label="Disconnetti"
        class="p-2 rounded-lg text-neutral-400 hover:text-red-400 hover:bg-red-500/10 cursor-pointer transition-all shrink-0 focus:outline-none focus:ring-2 focus:ring-red-500 focus:text-red-400 focus:bg-red-500/20"
        title="Disconnetti"
        (click)="onClickLogout()">
        <i class="pi pi-sign-out text-sm"></i>
      </button>
    </div>
  </div>

  <g-show-message/>
</aside>
