<!-- Card Video -->
<div class="group relative w-72 aspect-video rounded-lg overflow-hidden cursor-pointer transition-all duration-300 hover:ring-2 hover:ring-violet-500 hover:shadow-xl hover:shadow-violet-900/20 text-white shrink-0">

  <!-- Immagine di sfondo -->
  <div class="absolute inset-0 bg-no-repeat bg-center bg-cover transition-transform duration-500 group-hover:scale-110"
    [style.backgroundImage]="resolvedIcon() ? 'url(' + resolvedIcon() + ')' : ''">
  </div>

  <!-- Overlay scuro -->
  <div class="absolute inset-0 bg-linear-to-t from-black/90 via-black/20 to-transparent transition-colors duration-300 group-hover:bg-black/40"></div>

  <!-- Icona Play al centro (Appare in hover) -->
  <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10">
    <div class="flex justify-items-center bg-violet-600/80 p-4 rounded-full backdrop-blur-sm shadow-lg">
      <span class="pi pi-play text-2xl"></span>
    </div>
  </div>

  <!-- Informazioni (Titolo, Episodio, Minuti rimasti) -->
  <div class="absolute bottom-3 left-3 right-3 z-10 flex flex-col gap-2">
    <div class="flex justify-between items-end">
      <div class="flex flex-col overflow-hidden mr-2">
        <h3 class="font-semibold text-sm truncate w-48">{{cardTitle()}}</h3>
        @if (season() && episode()) {
          <p class="text-neutral-300 text-xs truncate">S{{season()}}:E{{episode()}}@if (epName()) { - "{{epName()}}" }</p>
        } @else if (epName()) {
          <p class="text-neutral-300 text-xs truncate">{{epName()}}</p>
        }
      </div>
      <p class="text-xs font-medium text-neutral-400 shrink-0">{{minuteLeft()}}m left</p>
    </div>

    <!-- Barra di progresso dinamica -->
    <div class="w-full h-1 bg-neutral-600/80 rounded-full overflow-hidden backdrop-blur-md">
      <div class="h-full bg-violet-500 rounded-full shadow-[0_0_8px_rgba(139,92,246,0.8)] transition-all duration-300"
        [style.width.%]="progress()"></div>
    </div>
  </div>

</div>
