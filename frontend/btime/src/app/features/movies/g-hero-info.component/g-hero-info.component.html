<div class="relative z-10 flex flex-col gap-3 sm:gap-4 w-full">

  <h1 class="font-bold text-2xl sm:text-3xl md:text-4xl 2xl:text-5xl">{{bannerTitle()}}</h1>

  <!-- Filters -->
  <div class="flex flex-wrap flex-row justify-start items-center gap-2 text-neutral-500">
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs 2xl:text-sm">
      <p>4k HDR</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs 2xl:text-sm">
      <p>18+</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs 2xl:text-sm">
      <p>Sci-Fi</p>
    </div>
    <div class="bg-neutral-800 py-1 px-2 rounded-md cursor-pointer text-xs 2xl:text-sm">
      <p>Season 2</p>
    </div>
  </div>

  <!-- Description -->
  <div class="text-xs sm:text-sm 2xl:text-base w-full sm:w-4/5 md:w-2/3 lg:w-1/2 xl:w-1/3 text-neutral-400 sm:text-neutral-500 line-clamp-3 sm:line-clamp-none">
    <p>{{description()}}</p>
  </div>

  <!-- Actions -->
  <div class="flex flex-wrap flex-row justify-items-center gap-2.5 sm:gap-3 pt-1 sm:pt-2">

    <div
      tabindex="0"
      role="button"
      aria-label="Riproduci"
      class="flex flex-row justify-start items-center gap-2 py-2 px-4 sm:py-2.5 sm:px-5 rounded-xl bg-purple-700 drop-shadow-lg drop-shadow-purple-500/50 cursor-pointer transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-purple-400 focus:bg-purple-600 focus:scale-105 active:scale-95 text-white font-medium">
      <div class="pi pi-play-circle text-base sm:text-lg"></div>
      <span class="text-xs sm:text-sm 2xl:text-base font-semibold">Play</span>
    </div>
    <div
      tabindex="0"
      role="button"
      aria-label="Maggiori informazioni"
      class="flex flex-row justify-start items-center gap-2 py-2 px-4 sm:py-2.5 sm:px-5 rounded-xl bg-neutral-800/90 border border-neutral-700 cursor-pointer transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-purple-400 focus:bg-neutral-700 focus:scale-105 active:scale-95 text-white font-medium">
      <div class="pi pi-info-circle text-base sm:text-lg"></div>
      <span class="text-xs sm:text-sm 2xl:text-base font-semibold">More Info</span>
    </div>
  </div>

</div>
