<div
  tabindex="0"
  role="button"
  [attr.aria-label]="title()"
  class="group relative w-36 h-52 sm:w-40 sm:h-60 md:w-44 md:h-64 2xl:w-52 2xl:h-76 rounded-xl overflow-hidden cursor-pointer transition-all duration-300 text-white shrink-0
    hover:ring-2 hover:ring-violet-500 hover:shadow-xl hover:shadow-violet-900/30
    focus:outline-none focus:ring-4 focus:ring-purple-500 focus:scale-105 focus:shadow-2xl focus:shadow-purple-950/80"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()">

  <!-- Immagine di sfondo -->
  <div
    class="absolute inset-0 bg-no-repeat bg-center bg-cover transition-transform duration-500 group-hover:scale-110 group-focus:scale-110"
    [style.backgroundImage]="resolvedIcon() ? 'url(' + resolvedIcon() + ')' : ''">
  </div>

  <!-- Overlay scuro sfumato in basso con Titolo -->
  <div class="absolute inset-0 bg-linear-to-t from-black/85 via-black/20 to-transparent transition-opacity duration-300 flex flex-col justify-end p-3 z-10">
    @if (title()) {
      <p class="text-sm font-semibold truncate">{{title()}}</p>
    }
  </div>

  <!-- Badge in alto a destra (Stagioni o Anno) -->
  <div class="absolute top-2 right-2 z-10 flex items-center gap-1">
    @if (season() && season()! > 0) {
      <p class="text-[11px] font-medium text-white bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded border border-neutral-700/50">
        {{season()}} {{ season() === 1 ? 'Stagione' : 'Stagioni' }}
      </p>
    } @else if (year()) {
      <p class="text-[11px] font-medium text-white bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded border border-neutral-700/50">
        {{year()}}
      </p>
    }
  </div>

</div>
