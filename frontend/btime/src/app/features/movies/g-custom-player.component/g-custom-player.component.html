<div
  #playerContainer
  tabindex="0"
  class="relative w-full h-full bg-black overflow-hidden select-none outline-none focus:outline-none"
  (mousemove)="onUserActivity()"
  (mouseleave)="showControls.set(false)">

  <!-- 1. Player Video HTML5 nativo per Smart TV (Layer 0 - Hardware Accelerated) -->
  <video
    #videoPlayer
    autoplay
    playsinline
    [src]="episode()?.path"
    [poster]="episode()?.icon"
    (click)="togglePlay()"
    (play)="onVideoPlay()"
    (pause)="onVideoPause()"
    (ended)="onVideoEnded()"
    (timeupdate)="onTimeUpdate()"
    (loadedmetadata)="onLoadedMetadata()"
    [volume]="volume()"
    [muted]="isMuted()"
    class="absolute inset-0 w-full h-full object-contain cursor-pointer z-0">
  </video>

  <!-- 2. Overlay Controlli (Layer Z-40 - Sopra il video in tutte le modalità) -->
  <div
    class="controls-overlay absolute inset-0 z-40 flex flex-col justify-between transition-opacity duration-300 pointer-events-none"
    [class.opacity-0]="!showControls()"
    [class.pointer-events-auto]="showControls()">

    <!-- Barra Superiore (Gradiente scuro) -->
    <div class="flex flex-row justify-start items-center gap-3 w-full p-4 bg-gradient-to-b from-black/90 via-black/50 to-transparent pointer-events-auto">
      <button
        #backBtn
        type="button"
        class="flex items-center justify-center w-11 h-11 cursor-pointer rounded-full transition-all hover:bg-white/15 focus:outline-none focus:ring-1 focus:ring-purple-500 focus:bg-white/25 focus:scale-110 text-white"
        (click)="onBackClick.emit()"
        tabindex="0"
        aria-label="Torna indietro">
        <span class="pi pi-arrow-left text-lg"></span>
      </button>
      <h1 class="text-white text-base md:text-xl font-bold truncate drop-shadow-md">
        {{ episode()?.title }}
      </h1>
    </div>

    <!-- Barra Inferiore e Controlli Riproduzione -->
    <div class="flex flex-col justify-center items-center w-full px-4 sm:px-6 py-4 gap-3 bg-gradient-to-t from-black/95 via-black/60 to-transparent pointer-events-auto">

      <!-- Barra di Avanzamento (Timeline) -->
      <div
        (mousedown)="isDragging.set(true); seekTo($event)"
        (mousemove)="isDragging() && seekTo($event)"
        (mouseup)="isDragging.set(false)"
        (mouseleave)="isDragging.set(false)"
        tabindex="0"
        aria-label="Barra di avanzamento"
        (keydown.arrowleft)="onSkip(false); $event.stopPropagation()"
        (keydown.arrowright)="onSkip(true); $event.stopPropagation()"
        class="group relative w-full h-2 hover:h-3 bg-neutral-700/80 rounded-full cursor-pointer flex items-center focus:h-3.5 focus:ring-1 focus:ring-purple-500 focus:outline-none transition-all">
        <!-- Parte già vista (Viola) -->
        <div
          class="h-full bg-purple-500 rounded-full relative"
          [style.width.%]="slidePoint()">
          <!-- Pallino indicatore (Thumb) -->
          <span
            class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-purple-400 rounded-full shadow-lg scale-0 group-hover:scale-100 group-focus:scale-100 transition-transform">
          </span>
        </div>
      </div>

      <!-- Pulsanti Controlli -->
      <div class="flex flex-row justify-between items-center w-full text-white">

        <!-- Lato Sinistro: Play, Skip, Volume -->
        <div class="flex items-center gap-2 sm:gap-4">

          <!-- Riavvolgi 15s -->
          <button
            type="button"
            class="flex items-center justify-center w-11 h-11 cursor-pointer rounded-full transition-all hover:bg-white/15 focus:outline-none focus:ring-1 focus:ring-purple-500 focus:bg-white/25 focus:scale-110"
            (click)="onSkip(false)"
            tabindex="0"
            aria-label="Riavvolgi 15 secondi">
            <span class="pi pi-replay text-lg"></span>
          </button>

          <!-- Play / Pausa (Tasto Principale Telecomando) -->
          <button
            #playBtn
            type="button"
            class="flex items-center justify-center w-12 h-12 cursor-pointer rounded-full transition-all bg-purple-600/30 hover:bg-purple-600/60 focus:outline-none focus:ring-1 focus:ring-purple-400 focus:bg-purple-600 focus:scale-115 shadow-lg"
            (click)="togglePlay()"
            tabindex="0"
            aria-label="Riproduci o metti in pausa">
            <span class="pi text-xl ml-0.5" [class.pi-play]="!isPlaying()" [class.pi-pause]="isPlaying()"></span>
          </button>

          <!-- Avanza 15s -->
          <button
            type="button"
            class="flex items-center justify-center w-11 h-11 cursor-pointer rounded-full transition-all hover:bg-white/15 focus:outline-none focus:ring-1 focus:ring-purple-500 focus:bg-white/25 focus:scale-110"
            (click)="onSkip(true)"
            tabindex="0"
            aria-label="Avanza 15 secondi">
            <span class="pi pi-refresh text-lg"></span>
          </button>

          <!-- Volume & Mute -->
          <div class="group flex items-center ml-2">
            <button
              type="button"
              class="flex items-center justify-center w-11 h-11 cursor-pointer rounded-full transition-all hover:bg-white/15 focus:outline-none focus:ring-1 focus:ring-purple-500 focus:bg-white/25 focus:scale-110 z-10"
              (click)="toggleMute()"
              tabindex="0"
              aria-label="Muto o attiva audio">
              <span class="pi text-lg" [class.pi-volume-up]="!isMuted()" [class.pi-volume-off]="isMuted()"></span>
            </button>

            <!-- Slider Volume -->
            <div class="w-0 overflow-hidden opacity-0 group-hover:w-24 group-focus-within:w-24 group-hover:opacity-100 group-focus-within:opacity-100 transition-all duration-300 ease-in-out flex items-center">
              <div class="relative w-20 h-1.5 mx-2 bg-neutral-600 rounded-full flex items-center">
                <div class="absolute left-0 top-0 h-full bg-purple-500 rounded-full pointer-events-none"
                  [style.width.%]="volume() * 100">
                </div>
                <div class="absolute top-1/2 w-3 h-3 bg-white rounded-full shadow pointer-events-none"
                  [style.left.%]="volume() * 100"
                  style="transform: translate(-50%, -50%)">
                </div>
                <input
                  type="range" min="0" max="1" step="0.01"
                  [value]="volume()"
                  (input)="onVolumeChange($event)"
                  aria-label="Regola volume"
                  tabindex="0"
                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer m-0"
                />
              </div>
            </div>
          </div>

        </div>

        <!-- Lato Destro: Durata e Fullscreen -->
        <div class="flex items-center gap-3">
          <!-- Tempo Trascorso / Totale -->
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs md:text-sm font-mono text-neutral-300 bg-white/5 border border-white/10">
            <span class="pi pi-clock text-xs text-purple-400"></span>
            <span>{{ formattedTime() }}</span>
          </div>

          <!-- Tasto Schermo Intero (Fullscreen) -->
          <button
            type="button"
            class="flex items-center justify-center w-11 h-11 cursor-pointer rounded-full transition-all hover:bg-white/15 focus:outline-none focus:ring-1 focus:ring-purple-500 focus:bg-white/25 focus:scale-110"
            (click)="toggleFullscreen()"
            tabindex="0"
            aria-label="Schermo intero">
            <span class="pi text-lg" [class.pi-arrow-up-right-and-arrow-down-left-from-center]="!isFullscreen()" [class.pi-arrow-down-left-and-arrow-up-right-to-center]="isFullscreen()"></span>
          </button>
        </div>

      </div>
    </div>

  </div>

</div>
