<div #playerContainer class="relative w-full h-full"
  (mousemove)="onUserActivity()"
  (mouseleave)="showControls.set(false)"
  (keydown)="onUserActivity()">

  <!-- Controls -->
  <div
    [class.opacity-0]="!showControls()"
    [class.pointer-events-none]="!showControls()"
    class="transition-opacity duration-300">
    <div class="absolute top-0 left-0 flex flex-row justify-start items-center gap-2 w-full p-3 z-50">
      <button type="button" class="flex items-center gap-2 p-3 cursor-pointer rounded-full transition-all hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white/20" (click)="onBackClick.emit()" tabindex="0">
        <span class="pi pi-arrow-left"></span>
      </button>
      <h1>{{ episode()?.title }}</h1>
    </div>


    <!-- Progress Bar & Controls -->
    <div class="absolute bottom-0 left-0 z-50 flex flex-col justify-center items-center w-full px-3 py-1 gap-3">
      <!-- Progress Bar -->
      <div
        (mousedown)="isDragging.set(true); seekTo($event)"
        (mousemove)="isDragging() && seekTo($event)"
        (mouseup)="isDragging.set(false)"
        (mouseleave)="isDragging.set(false)"
        tabindex="0"
        (keydown.arrowleft)="onSkip(false); $event.stopPropagation()"
        (keydown.arrowright)="onSkip(true); $event.stopPropagation()"
        class="group relative w-full h-1.5 hover:h-2 bg-neutral-700/80 rounded-full cursor-pointer flex items-center focus:h-2.5 focus:ring-2 focus:ring-purple-400 focus:outline-none">
        <!-- Parte già vista (Viola) -->
        <div
          class="h-full bg-purple-500 rounded-full relative"
          [style.width.%]="slidePoint()">
          <!-- Pallino indicatore -->
          <span
            class="absolute right-0 top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-violet-500 rounded-full shadow scale-0 group-hover:scale-100 group-focus:scale-100 transition-transform focus:h-3.5 outline-none border-none">
          </span>
        </div>
      </div>


      <!-- Controls -->
      <div class="flex flex-row justify-between gap-5 items-center w-full text-xl">

        <!-- Left Side -->
        <div class="flex flex-row justify-start px-0 w-full">
          <button type="button" class="flex items-center gap-2 p-3 cursor-pointer rounded-full transition-all hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white/20" (click)="onSkip(false)" tabindex="0">
            <span class="pi pi-replay"></span>
          </button>
          <button type="button" class="flex items-center gap-2 p-3 cursor-pointer rounded-full transition-all hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white/20" (click)="togglePlay()" tabindex="0" >
            <span class="pi" [class.pi-play-circle]="!isPlaying()" [class.pi-pause-circle]="isPlaying()"></span>
          </button>
          <button type="button" class="flex items-center gap-2 p-3 cursor-pointer rounded-full transition-all hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white/20" (click)="onSkip(true)" tabindex="0">
            <span class="pi pi-refresh"></span>
          </button>

          <!-- Volume -->
          <div class="group flex items-center">

            <!-- Icona Mute/Unmute -->
            <button type="button" class="flex items-center justify-center w-10 h-10 cursor-pointer rounded-full transition-all hover:bg-white/10 z-10 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white/20" (click)="toggleMute()" tabindex="0">
              <span class="pi" [class.pi-volume-up]="!isMuted()" [class.pi-volume-off]="isMuted()"></span>
            </button>

            <!-- Contenitore Slider (Si espande orizzontalmente in hover) -->
            <div class="w-0 overflow-hidden opacity-0 group-hover:w-24 group-hover:opacity-100 transition-all duration-300 ease-in-out flex items-center">

              <!-- Struttura della barra personalizzata -->
              <div class="relative w-20 h-1.5 mx-2 bg-neutral-600 rounded-full flex items-center">

                <!-- Parte colorata (Viola) che indica il livello del volume -->
                <div class="absolute left-0 top-0 h-full bg-purple-500 rounded-full pointer-events-none"
                    [style.width.%]="volume() * 100">
                </div>

                <!-- Pallino indicatore (Thumb) -->
                <div class="absolute top-1/2 w-3 h-3 bg-white rounded-full shadow pointer-events-none transition-transform group-hover:scale-110"
                    [style.left.%]="volume() * 100"
                    style="transform: translate(-50%, -50%)">
                </div>

                <!-- Input nativo trasparente sovrapposto (gestisce il click e il trascinamento) -->
                <input
                  type="range" min="0" max="1" step="0.01"
                  [value]="volume()"
                  (input)="onVolumeChange($event)"
                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer m-0"
                />

              </div>
            </div>

          </div>

        </div>

        <!-- Right Side -->
        <div class="flex flex-row justify-end px-0 w-full">
          <!-- Time -->
          <div class="flex items-center gap-2 p-3 rounded-full text-sm font-mono">
            <span class="pi pi-clock"></span>
            <span>{{ formattedTime() }}</span>
          </div>

          <!-- Fullscreen -->
          <button type="button" class="flex items-center gap-2 p-3 cursor-pointer rounded-full transition-all hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white/20" (click)="toggleFullscreen()" tabindex="0">
            <span class="pi pi-arrow-up-right-and-arrow-down-left-from-center"></span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Player Video HTML5 nativo per Smart TV -->
  <video
    #videoPlayer
    autoplay
    playsinline
    [src]="episode()?.path"
    [poster]="episode()?.icon"
    (click)="togglePlay()"
    (play)="onVideoPlay()"
    (pause)="onVideoPause()"
    (close)="saveProgress()"
    (ended)="onVideoEnded()"
    (timeupdate)="onTimeUpdate()"
    (loadedmetadata)="onLoadedMetadata()"
    [volume]="volume()"
    [muted]="isMuted()"
    class="w-full h-full object-contain cursor-pointer z-30">
  </video>

</div>
