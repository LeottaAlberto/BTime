<div
  tabindex="0"
  role="button"
  [attr.aria-label]="label()"
  class="font-extralight px-2.5 py-1.5 md:p-1 rounded-xl cursor-pointer transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-neutral-800 focus:scale-[1.02] shrink-0"
  [class.bg-cyan-600/60]="isSelected()"
  [class.bg-transparent]="!isSelected()"
  [class.hover:bg-neutral-700]="!isSelected()"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()">
  <div class="flex flex-row justify-start items-center gap-2 md:gap-3 md:max-w-3/4">
    <div class="hidden md:block pi pi-chevron-right text-xs pl-4"></div>
    <div class="pi pi-{{icon()}} text-sm 2xl:text-base"></div>
    <div class="text-xs sm:text-sm 2xl:text-base whitespace-nowrap">{{label()}}</div>
  </div>
</div>
