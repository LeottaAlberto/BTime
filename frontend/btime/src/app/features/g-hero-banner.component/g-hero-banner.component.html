<div class="relative w-full min-h-72 sm:min-h-95 md:min-h-110 2xl:min-h-130 px-4 sm:px-7 py-6 sm:py-10 rounded-xl outline-1 outline-neutral-800 overflow-hidden flex items-end shadow-2xl">

  <!-- Background Wallpaper -->
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-0 bg-no-repeat bg-center bg-cover transition-all duration-700"
      [style.backgroundImage]="'url(' + bannerIcon() + ')'"></div>
    <div class="absolute inset-0 bg-linear-to-r from-black/93 from-30% to-transparent"></div>
    <div class="absolute inset-0 bg-linear-to-t from-black/60 via-transparent to-transparent"></div>
  </div>

  <!-- Context (visibile solo se è presente un titolo effettivo) -->
  @if (movS.movieBanner()?.heroTitle) {
    <g-hero-info
      [bannerTitle]="movS.movieBanner()?.heroTitle ?? ''"
      [description]="movS.movieBanner()?.description ?? ''" />
  }

</div>
