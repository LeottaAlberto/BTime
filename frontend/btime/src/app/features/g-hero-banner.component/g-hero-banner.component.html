<div class="relative w-full px-7 py-10 rounded-xl outline-1 outline-neutral-800 overflow-hidden">

  <!-- Background -->
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-0 bg-no-repeat bg-center bg-cover"
    [style.backgroundImage]="dashboard.movieBanner()?.icon ? 'url(' + dashboard.movieBanner()!.icon + ')' : ''"></div>
    <div class="absolute inset-0 bg-linear-to-r from-black/93 from-30% to-transparent"></div>
  </div>

  <!-- Context -->
  <g-hero-info [bannerTitle]="dashboard.movieBanner()?.heroTitle ?? ''" [description]="dashboard.movieBanner()?.description ?? ''" />
</div>
