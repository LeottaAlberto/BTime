<div
  class="left-0 top-0 fixed flex justify-center items-center w-full h-full bg-neutral-950/30 z-50"
  [class.hidden]="!isVisible()">

  <div class="relative flex flex-col gap-4 w-2/12 min-w-72 p-4 outline-1 rounded-md bg-neutral-800 outline-neutral-700">

    <button
      type="button"
      class="absolute top-1.5 right-1.5 p-1 text-neutral-400 hover:text-white hover:bg-neutral-700 rounded-full cursor-pointer pi pi-times text-xs"
      (click)="onResponse(false)">
    </button>

    <h1 class="font-semibold text-white">{{title()}}</h1>
    <p class="text-gray-200 text-xs">
      {{message()}}
    </p>

    <div class="flex flex-row justify-end gap-1">
      <button
        type="button"
        class="px-2 py-1 text-xs rounded-xl cursor-pointer hover:bg-sky-600/50 hover:text-red-800"
        (click)="onResponse(false)">Cancel</button>
      <button
        type="button"
        class="px-2 py-1 text-xs rounded-xl cursor-pointer hover:bg-sky-600/50 hover:text-lime-600"
        (click)="onResponse(true)">Confirm</button>
    </div>

  </div>
</div>
