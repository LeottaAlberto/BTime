services:
  postgres:
    image: postgres:16-alpine
    container_name: btime_db
    environment:
      POSTGRES_USER: cloudadmin
      POSTGRES_PASSWORD: cloudpassword123
      POSTGRES_DB: btime_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: btime_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloud.local
      PGADMIN_DEFAULT_PASSWORD: adminpassword123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data: